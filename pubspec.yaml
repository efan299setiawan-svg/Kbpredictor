name: kb_predictor_ai
description: "KB Predictor AI - Offline result history & local rule-based prediction engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # State management
  provider: ^6.1.1

  # Charts
  fl_chart: ^0.66.0

  # Export / Import / Backup
  csv: ^6.0.0
  share_plus: ^7.2.1
  file_picker: ^6.1.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
